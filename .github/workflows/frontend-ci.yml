name: Frontend CI

on: push

env:
  PNPM_VERSION: 9

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-frontend
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Lint
        run: pnpm lint
        working-directory: ./frontend

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-frontend
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Type check
        run: pnpm type-check
        working-directory: ./frontend
