version: 2.1

# 1. Define reusable logic (replaces your custom setup-frontend action)
commands:
  setup-frontend:
    parameters:
      pnpm-version:
        type: string
        default: "9"
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: |
            corepack enable
            corepack prepare pnpm@<< parameters.pnpm-version >> --activate
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "frontend/pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          working_directory: frontend
          command: pnpm install
      - save_cache:
          key: v1-deps-{{ checksum "frontend/pnpm-lock.yaml" }}
          paths:
            - frontend/node_modules

# 2. Define the execution environment
executors:
  node-docker:
    docker:
      - image: cimg/node:20.0 # Or your preferred Node version
    working_directory: ~/project

# 3. Define the Jobs
jobs:
  lint:
    executor: node-docker
    steps:
      - setup-frontend
      - run:
          name: Lint
          working_directory: frontend
          command: pnpm lint

  type-check:
    executor: node-docker
    steps:
      - setup-frontend
      - run:
          name: Type check
          working_directory: frontend
          command: pnpm type-check

# 4. Define the Workflow
workflows:
  Frontend CI:
    jobs:
      - lint
      - type-check