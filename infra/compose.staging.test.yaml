name: watch-hub

services:
  nginx:
    image: nginx
    networks:
      - wh-internal
    restart: 'unless-stopped'
    ports:
      - "80:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      auth:
        condition: service_healthy
      web:
        condition: service_started
      video:
        condition: service_started

  auth:
    image: registry.gitlab.com/watch-hub/watch-hub/auth
    build:
      context: ../auth/
      dockerfile: Dockerfile.local
    restart: 'on-failure'
    secrets:
      - target: /etc/secrets/db_password
        source: db_password
      - target: /etc/secrets/jwt_private
        source: jwt_private
      - target: /etc/secrets/jwt_public
        source: jwt_public
    environment:
      - DB_USER=${DB_USER}
      - DB_NAME=auth
      - DB_HOST=ep-autumn-cell-alfmgzkg-pooler.c-3.eu-central-1.aws.neon.tech
      - DB_PORT=5432
      - DB_SCHEME=postgresql+asyncpg
      - DB_SSL_MODE=require

      - USE_SECURE_COOKIES=False
      - GRPC_ADDR=0.0.0.0:50051
      - APP_ENV=staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wh-internal

  video:
    image: registry.gitlab.com/watch-hub/watch-hub/video
    build:
      context: ../video
      dockerfile: Dockerfile.local
    environment:
      - DB_USER=${DB_USER}
      - DB_NAME=video
      - DB_HOST=ep-autumn-cell-alfmgzkg-pooler.c-3.eu-central-1.aws.neon.tech
      - DB_PORT=5432
      - DB_SCHEME=postgresql+asyncpg
      - DB_SSL_MODE=require

      - GRPC_ADDR=auth:50051

      - AWS_ACCESS_KEY_ID=SET_YOUR_ACCESS_KEY
      - AWS_SECRET_ACCESS_KEY=YOUR_SECRET
      - AWS_REGION=YOUR_AWS_REGION

      - S3_BUCKET_NAME=SET_YOUR_BUCKET
      - S3_FORCE_PATH_STYLE=False

      - APP_ENV=staging
      - AUTH_ADDR=http://wh.com/api/auth
    secrets:
      - target: /etc/secrets/jwt_public
        source: jwt_public
      - target: /etc/secrets/db_password
        source: db_password
    networks:
      - wh-internal
    depends_on:
      auth:
        condition: service_healthy

  web:
    image: registry.gitlab.com/watch-hub/watch-hub/web
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://wh.com/api
      - NEXT_PUBLIC_WS_URL=ws://wh.com
      - NEXT_PUBLIC_CLOUDFRONT_URL=https://d24lanzu8wxnoe.cloudfront.net/:path*
      - NEXT_PUBLIC_IMAGES_CLOUDFRONT_URL=dk3at0kil7p4c.cloudfront.net
    restart: 'on-failure'
    secrets:
      - target: /etc/secrets/jwt_public
        source: jwt_public
    networks:
      - wh-internal


secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem

networks:
  wh-internal:
