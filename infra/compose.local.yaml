name: watch-hub

services:
  nginx:
    image: nginx
    networks:
      - wh-internal
    restart: 'unless-stopped'
    ports:
      - "80:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      auth:
        condition: service_healthy
      web:
        condition: service_started

  db:
    image: postgres
    restart: 'unless-stopped'
    secrets:
      - db_password
    environment:
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./scripts/init_sql.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    networks:
      - wh-internal

  auth:
    build:
      context: ../auth/
      dockerfile: Dockerfile.local
    restart: 'on-failure'
    secrets:
      - db_password
      - jwt_private
      - jwt_public
    environment:
      - DB_USER=${DB_USER}
      - DB_NAME=auth
      - DB_HOST=db
      - DB_PORT=5432
      - DB_SCHEME=postgresql+asyncpg

      - USE_SECURE_COOKIES=False
      - GRPC_ADDR=0.0.0.0:50051
      - APP_ENV=local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wh-internal
    depends_on: 
      db:
        condition: service_healthy
        restart: true

  video:
    build:
      context: ../video
      dockerfile: Dockerfile.local
    entrypoint: ["/usr/local/bin/init_video_data.sh"]
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080", "--reload" ]
    environment:
      - DB_USER=${DB_USER}
      - DB_NAME=video
      - DB_HOST=db
      - DB_PORT=5432
      - DB_SCHEME=postgresql+asyncpg

      - GRPC_ADDR=auth:50051

      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1

      - S3_ENDPOINT_URL=http://localhost.localstack.cloud:4566
      - S3_BUCKET_NAME=my-test-bucket
      - S3_FORCE_PATH_STYLE=True     # Set to True for localstack

      - APP_ENV=local
      - AUTH_ADDR=http://wh.com/api/auth
    volumes:
      - "./scripts/init_video_data.sh:/usr/local/bin/init_video_data.sh"
    secrets:
      - jwt_public
      - db_password
    networks:
      - wh-internal
    depends_on:
      auth:
        condition: service_healthy
      db:
        condition: service_healthy
        restart: true

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL="http://wh.com/api"
      - NEXT_PUBLIC_WS_URL="ws://wh.com"
      - NEXT_PUBLIC_CLOUDFRONT_URL="https://d24lanzu8wxnoe.cloudfront.net/:path*"
      - NEXT_PUBLIC_IMAGES_CLOUDFRONT_URL="dk3at0kil7p4c.cloudfront.net"
    restart: 'on-failure'
    secrets:
      - jwt_public
    networks:
      - wh-internal

  localstack:
    image: localstack/localstack-pro:latest
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # External services port range
      - "127.0.0.1:8443:443"              # HTTPS Gateway (Pro feature)
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      # Persistence (keeps your resources after restart)
      - PERSISTENCE=1
      - DEBUG=1
      - LS_LOG=info
    volumes:
      - "./volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./scripts/init_localstack.sh:/etc/localstack/init/ready.d/init_s3.sh:ro"
      - "./config/cors-config.json:/tmp/cors-config.json:ro"
    networks:
      wh-internal:
        aliases:
          - s3.localhost.localstack.cloud
          - localhost.localstack.cloud


secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem

networks:
  wh-internal:
