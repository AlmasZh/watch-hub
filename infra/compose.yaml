name: watch-together

services:
  db:
    image: postgres
    restart: 'unless-stopped'
    secrets:
      - source: db_password
    environment:
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./scripts/init_sql.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    networks:
      - wt-internal
  auth:
    build:
      context: ../auth/
      dockerfile: Dockerfile.dev
    restart: 'unless-stopped'
    volumes:
      - "../auth:/app"
    secrets:
      - db_password
      - jwt_private
      - jwt_public
    ports:
      - "8080:8080"
    networks:
      - wt-internal

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem

networks:
  wt-internal: