name: watch-together

services:
  nginx:
    image: nginx
    networks:
      - wt-internal
    restart: 'unless-stopped'
    ports: 
    - "80:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      auth:
        condition: service_healthy
      web:
        condition: service_started

  db:
    image: postgres
    restart: 'unless-stopped'
    secrets:
      - db_password
    environment:
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./scripts/init_sql.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    networks:
      - wt-internal

  auth:
    build:
      context: ../auth/
      dockerfile: Dockerfile.dev
    restart: 'on-failure'
    volumes:
      - "../auth:/app"
    secrets:
      - db_password
      - jwt_private
      - jwt_public
    environment:
      - USE_SECURE_COOKIES=False
      - DB_USER=${DB_USER}
      - DB_NAME=auth
      - DB_HOST=db
      - DB_PORT=5432
      - DB_SCHEME=postgresql+asyncpg
    # ports:
    #   - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wt-internal
    depends_on: 
      db:
        condition: service_healthy
        restart: true

  video:
    build:
      context: ../video
      dockerfile: Dockerfile.dev
    # ports:
    #   - "8081:8081"
    environment:
      - DB_USER=${DB_USER}
      - DB_NAME=video
      - DB_HOST=db
      - DB_PORT=5432
      - DB_SCHEME=postgresql+asyncpg
    volumes:
      - "../video:/app"
    secrets:
      - jwt_public
      - db_password
    networks:
      - wt-internal
    depends_on:
      auth:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    restart: 'on-failure'
    entrypoint: ["/usr/local/bin/load_public_key.sh"]
    command: ["npm", "run", "dev"]
    # ports:
    #   - "3000:3000"
    volumes:
      - "../frontend:/app"
      - "./scripts/load_public_key.sh:/usr/local/bin/load_public_key.sh"
    secrets:
      - jwt_public
    networks:
      - wt-internal

  localstack:
    image: localstack/localstack-pro
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"



secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem

networks:
  wt-internal:
