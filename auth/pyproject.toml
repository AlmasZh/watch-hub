[project]
name = "auth"
version = "0.1.0"
description = "Auth service for Watch-Hub Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.135.3",
    "grpcio==1.78.0",
    "grpcio-tools==1.78.0",
    "passlib[argon2]>=1.7.4",
    "pydantic[email]>=2.12.5",
    "pyjwt[crypto]>=2.12.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.24",
    "sqlalchemy>=2.0.49",
    "types-passlib>=1.7.7.20260211",
    "uvicorn[standard]>=0.44.0",
]
[dependency-groups]
dev = [
    "grpcio-tools==1.78.0",
    "types-passlib>=1.7.7.20260211",
]

[tool.ruff]
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bugs)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modernize syntax)
    "ARG", # flake8-unused-arguments
]
lint.ignore = ["E501"] # Ignore line length if you let the formatter handle it
exclude = [
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*_pb2.pyi",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_executable = ".venv/bin/python"
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
files = ["src"] 

# --- Strictness rules ---
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true

# --- Ignore missing imports for third-party libraries without stubs ---
[[tool.mypy.overrides]]
module = [
    "grpc.*",
    # Add other untyped libraries here (e.g., "jose.*", "passlib.*")
]
ignore_missing_imports = true

# --- Ignore auto-generated gRPC code ---
[[tool.mypy.overrides]]
module = "grpc_gen.*"
ignore_errors = true

